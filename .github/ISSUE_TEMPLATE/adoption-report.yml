    id: name
    attributes:
      label: First Name
      placeholder: Your first name
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Job Title
      placeholder: Your job title
    validations:
      required: true

  - type: input
    id: organization_or_team
    attributes:
      label: Company
      placeholder: Your company
    validations:
      required: true

