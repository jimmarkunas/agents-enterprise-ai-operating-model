name: Adoption report
description: Report how you used A.G.E.N.T.S. and what outcome it supported.
title: "I used Jim's A.G.E.N.T.S. Toolkit to build..."
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using A.G.E.N.T.S. Please describe the real use case and outcome so the adoption can be understood and verified.

  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Your name
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role
      placeholder: Your role
    validations:
      required: true

  - type: input
    id: organization_or_team
    attributes:
      label: Organization or team
      placeholder: Organization or team
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country
      placeholder: Country
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: How did you use A.G.E.N.T.S.?
      placeholder: Describe the use case
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What decision, improvement, or outcome did it support?
      placeholder: Share the result
    validations:
      required: true

  - type: dropdown
    id: cite_publicly
    attributes:
      label: Can Jim cite this publicly?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: contact_for_verification
    attributes:
      label: Can Jim contact you for verification?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
