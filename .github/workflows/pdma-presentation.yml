name: PDMA Webcast Presentation
on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - "Free Toolkit Download/PDMA Edition/**"
      - ".github/workflows/pdma-presentation.yml"
  pull_request:
    paths:
      - "presentation/**"
      - ".github/workflows/pdma-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdma-presentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Typecheck, build one self-contained index.html, then fail on any external
      # reference or a file over the 1 MB budget (scripts/verify-build.mjs).
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: presentation/dist/

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages
      - name: Attach the offline presentation and PDMA leave-behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          tar -xf pages/artifact.tar -C assets
          mv assets/index.html "assets/PDMA-Webcast-The-New-PM-Operating-System.html"
          cp "Free Toolkit Download/PDMA Edition/AGENTS-Enterprise-Model-PDMA.pdf" "Free Toolkit Download/PDMA Edition/AGENTS-Enterprise-Model-PDMA.docx" assets/
          tag="pdma-webcast-v1"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "PDMA Webcast · The New PM Operating System" \
              --notes "Single-file presentation (open the .html in any modern browser; no install, works offline) and the PDMA edition of the A.G.E.N.T.S. leave-behind. Hosted version: https://jimmarkunas.github.io/agents-enterprise-ai-operating-model/"
          fi
          gh release upload "$tag" assets/*.html assets/*.pdf assets/*.docx --clobber
