name: PDMA Webcast Presentation
on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - "Free Toolkit Download/PDMA Edition/**"
      - ".github/workflows/pdma-presentation.yml"
  pull_request:
    paths:
      - "presentation/**"
      - "Free Toolkit Download/PDMA Edition/**"
      - ".github/workflows/pdma-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdma-presentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Typecheck, build one self-contained index.html, then fail on any external
      # reference or a file over the 1 MB budget (scripts/verify-build.mjs).
      - run: npm run build
      # The committed downloads must be exactly what this source builds (the build and ZIP are reproducible).
      - name: Check committed downloads are current
        run: |
          python3 -I scripts/package-downloads.py
          git diff --exit-code -- "../Free Toolkit Download/PDMA Edition/" \
            || { echo "::error::Downloads are stale. Run: npm run build && python3 scripts/package-downloads.py, then commit."; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: presentation/dist/

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach the downloadable presentation, leave-behind and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: Free Toolkit Download/PDMA Edition
        run: |
          tag="pdma-webcast-v1"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "PDMA Webcast · The New PM Operating System" \
              --notes "PDMA-Webcast-Kit.zip has everything. Or download the presentation (.html: open in any modern browser, no install, works offline) and the PDMA edition A.G.E.N.T.S. leave-behind (.pdf, .docx) individually. Hosted version: https://jimmarkunas.github.io/agents-enterprise-ai-operating-model/"
          fi
          gh release upload "$tag" PDMA-Webcast-The-New-PM-Operating-System.html AGENTS-Enterprise-Model-PDMA.pdf AGENTS-Enterprise-Model-PDMA.docx PDMA-Webcast-Kit.zip --clobber
